      - generic [ref=e51]:
        - heading "The Problem" [level=2] [ref=e52]
        - paragraph [ref=e53]: "Contractors were managing jobs in JobTread and leads/clients in GoHighLevel with zero data flow between them — double entry, missed follow-ups, and no unified view of a customer journey. The core challenge was an ETL problem across two platforms paired with a deduplication problem: the same human exists in both systems, under different schemas, and must never be created twice."
      - generic [ref=e54]:
        - generic [ref=e55]:
          - heading "The Approach" [level=2] [ref=e56]
          - paragraph [ref=e57]: I mapped the full entity model of each platform, then designed a bidirectional sync keyed on a waterfall match (phone → email → name). On a GoHighLevel pipeline-stage change, the integration finds-or-creates down JobTread's hierarchy in dependency order — customer, then contact, then location, then job — wiring each record to the ones above it. Built on Pipedream with custom JavaScript at nearly every step, Supabase bridging state between the platforms, and GoHighLevel's native automations driving the proof-of-concept triggers.
