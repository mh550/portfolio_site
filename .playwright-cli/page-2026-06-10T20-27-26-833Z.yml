      - generic [ref=e115]:
        - heading "Challenges" [level=2] [ref=e116]
        - paragraph [ref=e117]: "JobTread and GoHighLevel model the same business differently — in JobTread a location belongs to a customer and carries one contact; in GoHighLevel an opportunity carries one contact and moves through tenant-specific pipeline stages. I originally matched a GHL contact to a JobTread customer, then refined mid-milestone to match contact-to-contact for robustness. Multi-tenant auth added real complexity: an Agency OAuth token with per-subaccount logic for GoHighLevel, and Connected Organizations for JobTread."
      - generic [ref=e119]:
        - heading "Outcome" [level=2] [ref=e120]
        - paragraph [ref=e121]: Delivered a scalable, multi-tenant integration that became the foundation of Builder Clarity's productized offering — replacing per-client buildouts and cutting onboarding from roughly two days to about six hours, with leads flowing straight into job records and no manual re-entry.
      - generic [ref=e122]:
        - heading "In the Code" [level=2] [ref=e123]
        - figure "Waterfall find-or-create (phone → email → name) javascript" [ref=e125]:
          - generic [ref=e126]:
            - generic [ref=e127]: Waterfall find-or-create (phone → email → name)
            - generic [ref=e128]: javascript
          - code [ref=e130]: "// Match an incoming GHL contact to an existing JobTread record // in priority order, so the same person is never created twice. async function findOrCreateContact(ghlContact, jobtread) { const candidates = [ () => jobtread.findContactByPhone(ghlContact.phone), () => jobtread.findContactByEmail(ghlContact.email), () => jobtread.findContactByName(ghlContact.name), ]; for (const lookup of candidates) { const match = await lookup(); if (match) return match; // first hit wins — phone is strongest } // No match anywhere in the waterfall → safe to create. return jobtread.createContact(ghlContact); }"
