      - generic [ref=e50]:
        - heading "The Problem" [level=2] [ref=e51]
        - paragraph [ref=e52]: QA ran on a patchwork of Google Sheets — each team member kept their own sheet with their own columns. Issues had no status history, no categories or tags, and no record of when anything moved between states. The lead engineer wasn't marking issues complete, so the team had to manually re-test each build to figure out what had actually been fixed.
      - generic [ref=e53]:
        - generic [ref=e54]:
          - heading "The Approach" [level=2] [ref=e55]
          - paragraph [ref=e56]: I championed Linear as a single source of truth, chosen specifically for its strong API, Git integration, full issue timeline, and — critically — its MCP server and community CLI tooling. Since the lead engineer was already using Claude Code to convert spreadsheet rows into markdown for triage, I wired Linear directly into that agentic workflow so the AI could fetch and update issues in place instead of copy-pasting.
        - figure "From scattered per-person spreadsheets to an automated file → dedup → triage → implement pipeline." [ref=e59]:
