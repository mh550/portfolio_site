      - generic [ref=e91]:
        - heading "Challenges" [level=2] [ref=e92]
        - paragraph [ref=e93]: "The win wasn't just adopting a tool — it was redesigning the bug lifecycle around automation. Filing and triage are now hands-off: duplicates are detected automatically and appended as comments to the existing issue rather than spawning new ones, and triage surfaces a likely root cause plus the context a developer needs to decide how to approach the fix."
      - generic [ref=e95]:
        - heading "Outcome" [level=2] [ref=e96]
        - paragraph [ref=e97]: The team went from fragmented sheets to an organized, automated pipeline across filing, triage, and implementation — roughly doubling sprint throughput and cutting bug-filing time by about 80%.
